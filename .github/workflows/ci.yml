name: ci

on:
  push:
    branches: [master, main]
    # A tag is what gives a released image its version; the branch gives it `latest` and its commit.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Keep the compiled plugin, so it can be dropped into any Nakama image
        uses: actions/upload-artifact@v4
        with:
          name: nakama-module-${{ github.sha }}
          path: build/index.js
          if-no-files-found: error
          retention-days: 30
      - name: Unit tests against the built bundle
        run: npm test
      - name: Pull the Nakama image, with retries
        # Docker Hub rate limits anonymous pulls and a CI runner shares its address with everyone
        # else on that host, so a pull that fails here is not a broken repository.
        run: |
          for i in 1 2 3; do
            docker pull heroiclabs/nakama:3.32.0 && exit 0
            echo "pull attempt $i failed, waiting"
            sleep 20
          done
          docker pull heroiclabs/nakama:3.32.0
      - name: The plugin must load in the real Nakama runtime
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          node scripts/smoke.mjs 127.0.0.1 7350
      - name: What is running and what it said
        if: always()
        run: |
          docker compose ps
          docker compose logs nakama | tail -80


  image:
    # Only a push publishes. A pull request from a fork cannot write to the registry anyway, and a
    # pull request from a branch would be noise in a package nobody asked for.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 becomes 1.2.3 and 1.2, the branch becomes `master`, and the default branch also
          # gets `latest`; the commit short sha is there so an image can always be traced back.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
# The image is the demo stack with this plugin baked in, on top of the pinned
# Nakama release (Apache-2.0); the plugin on its own is in the build job's
# artifact. amd64 only: the Node build would be emulated on another platform.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An image that says what it was built from, and a list of what is inside it.
          provenance: true
          sbom: true
