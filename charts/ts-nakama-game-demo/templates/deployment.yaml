apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ts-nakama-game-demo.fullname" . }}
  labels:
    {{- include "ts-nakama-game-demo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A player holds a realtime socket open, so a replica never leaves the Service before its successor
      # can accept one.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ts-nakama-game-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ts-nakama-game-demo.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ts-nakama-game-demo.fullname" . }}
      automountServiceAccountToken: false
      # Long enough for the node to shut its sockets down instead of dropping them mid-match.
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nakama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: internal
              containerPort: {{ .Values.service.internalPort }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          {{- if .Values.secret.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.existingSecret }}
          {{- end }}
          # The compose file asks the image for its health with `/nakama/nakama healthcheck`, which is a
          # command and not a path - so there is no HTTP endpoint this chart can honestly probe. A TCP
          # connect on the client port is what a game client does.
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                - ALL
